# 技能自身的体检配置 —— **技能不是工作区**，所以这里只讲一件事：范围。
#
# 技能目录里没有六区、不生成 STATE、也不需要索引；它只有一个硬要求：
#   **不许出现任何凭据** —— 模板、脚本、文档、示例一律不能带 Key。
# 而默认的凭据层是"各区递归"，技能里根本没有区 ⇒ 等于空集（v1.5.0 之前，
# 对技能目录跑 --only secrets 实际只扫了根目录那 8 个文件，是一道**空检查**）。
#
# 因此这里把凭据层设为 "."（整棵树）。注意同一个开关也会让**文档层变成整棵树**，
# 所以对技能目录跑**全量**体检会报 `templates/*` 里的一堆断链 —— 那是正常的：
# 模板里的相对链接要铺到工作区之后才有意义。**技能自检只跑 `--only secrets`。**
areas = []

[scan]
secrets = "."        # 凭据层 = 整棵技能树（自带一个 Key 都不能有）
exclude = []
